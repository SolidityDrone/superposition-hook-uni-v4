[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
base = "https://mainnet.base.org"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
